# norman: LoRA r=8 on randomly initialised scGPT (no-pretraining control)
seed: 42
data:
  name: norman
  split_seed: 1
model:
  backbone: scgpt
  pretrained: false
  max_genes: 512
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
  - self_attn
train:
  epochs: 20
  steps_per_epoch: 100
  batch_size: 8
  lr: 0.0002
  weight_decay: 0.0
  grad_clip: 1.0
  patience: 5
eval:
  n_cells: 16
  n_cells_val: 4
wandb:
  project: perturb-lora-bench
  mode: offline
