# Adamson, LoRA r=8
seed: 42

data:
  name: adamson
  split: simulation
  split_seed: 1
  n_hvg: 5000

model:
  backbone: scgpt
  max_genes: 1536

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [self_attn]

train:
  epochs: 15
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 0.0
  early_stopping_on: val_pearson_delta_de20

eval:
  top_de: 20

wandb:
  project: perturb-lora-bench
  mode: online
