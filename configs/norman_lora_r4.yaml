# norman: LoRA r=4
seed: 42
data:
  name: norman
  split_seed: 1
model:
  backbone: scgpt
  pretrained: true
  max_genes: 1536
lora:
  r: 4
  alpha: 8
  dropout: 0.05
  target_modules:
  - self_attn
train:
  epochs: 20
  steps_per_epoch: 200
  batch_size: 16
  lr: 0.0002
  weight_decay: 0.0
  grad_clip: 1.0
  patience: 5
eval:
  n_cells: 64
  n_cells_val: 16
wandb:
  project: perturb-lora-bench
  mode: offline
